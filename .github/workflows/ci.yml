name: Python CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate frontend JavaScript
        run: node --check static/app.js
      - name: Compile Python modules
        run: python -m compileall -q core main.py
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q -W default --tb=short 2>&1 | tee "$GITHUB_STEP_SUMMARY"
